spring.application.name=junior-developer-assessment
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/enviro365;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
